[project]
name = "id-card-scan-a4"
version = "0.1.0"
description = "证件照片（PDF/图片）→ 透视取正 + 去背景 + 色彩统一 → 一页 A4 1:1 打印"
requires-python = ">=3.10"
dependencies = [
    "pillow>=9.5",
    "numpy>=1.23",
    "pypdf>=3.9",
    "reportlab>=4.0",
]

[project.scripts]
idcard-a4 = "idcard_a4.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idcard_a4"]
